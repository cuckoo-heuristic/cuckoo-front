<div class="location">
        <span class="location__city">{{ city }}</span>
        <span class="location__area">{{ area }}</span>
        <svg-widget src="/icon/angle.svg" class="location__angle" [width]="28" [height]="28"
                [style.transform]="'rotate('+ angle+ 35 +'deg)'"></svg-widget>
        <span class="location__road">{{ road }}</span>
</div>
